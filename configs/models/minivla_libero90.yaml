# Official Model Specification: MiniVLA-LIBERO90 (Candidate B)
# Model contract and benchmark configuration for local comparison.

model_id: "minivla_libero90"
model_name: "MiniVLA-LIBERO90"
role: "SECONDARY_BASELINE_CANDIDATE_B"
status: "VERIFIED"

provenance:
  repository: "https://huggingface.co/Stanford-ILIAD/minivla-libero90-prismatic"
  revision: "4289f87e8e00706e188c7a3a61fc6e7d72ab2564"
  upstream_codebase: "https://github.com/Stanford-ILIAD/openvla-mini"
  upstream_commit: "0822b36227b5a771be4eb2680e34c559734c8fdc"
  backbone: "Qwen2.5-0.5B + DinoSigLIP-224px"
  manifest: "resources/manifests/models/minivla_libero90.yaml"
  runtime_receipt: "resources/manifests/models/minivla_libero90_runtime_receipt.json"
  execution_tier: "LIBERO-DERIVED (HOST_WIN32_PY3.12)"
  certification: "NON-COMPARABLE_OFFICIAL_PAPER"

model_contract:
  input_resolution: [224, 224]
  camera_order:
    - "agentview"
  proprioceptive_state_dim: 0
  action_dim: 7
  action_semantics:
    - "delta_eef_x"
    - "delta_eef_y"
    - "delta_eef_z"
    - "delta_eef_axis_angle_x"
    - "delta_eef_axis_angle_y"
    - "delta_eef_axis_angle_z"
    - "gripper_action"
  action_space: "continuous"
  action_range: [-1.0, 1.0]
  gripper_action_polarity: "INVERTED_RLDS_TO_ROBOSUITE"
  gripper_convention: "RLDS: 0 = Close, 1 = Open -> mapped to [-1, 1], sign-binarized, then inverted for Robosuite"
  chunk_size: 1
  execution_horizon: 1
  image_orientation: "flipud"

simulation_contract:
  robot: "Panda"
  gripper: "PandaGripper"
  controller: "OSC_POSE"
  control_frequency_hz: 20
  control_dt: 0.05
  max_steps_per_episode: 1000
  settling_steps: 10
  camera_resolution: [256, 256]
  libero_pinned_commit: "8f1084e3132a39270c3a13ebe37270a43ece2a01"
