# MiniVLA & MiniVLA-VQ Evaluation Environment (Phase 9)
# Provenance: https://github.com/Stanford-ILIAD/openvla-mini
# Primary Candidates:
#   - Stanford-ILIAD/minivla-libero90-prismatic
#   - Stanford-ILIAD/minivla-vq-libero90-prismatic
# Python Version: 3.10 (Isolated per AGENTS.md Rule 3)

name: minivla
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10.13
  - pip=24.0
  - pip:
    - torch==2.2.2
    - torchvision==0.17.2
    - transformers==4.40.2
    - accelerate==0.29.3
    - peft==0.10.0
    - timm==0.9.16
    - einops==0.7.0
    - tokenizers==0.19.1
    - numpy==1.24.4
    - h5py==3.11.0
    - opencv-python==4.9.0.80
    - pyyaml==6.0.1
    - pytest==8.1.1
    - scipy==1.12.0

