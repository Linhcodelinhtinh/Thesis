name: smolvla
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Inference environment for the pinned SmolVLA 0.6.1 policy interface.
  # Python and direct model-runtime dependencies are pinned so the F0 artifact
  # can be loaded without borrowing the perception or simulator environments.
  # LeRobot 0.6.1 metadata requires Python >=3.12.
  - python=3.12.3
  - pip
  - pip:
    - -r envs/smolvla_inference.txt
