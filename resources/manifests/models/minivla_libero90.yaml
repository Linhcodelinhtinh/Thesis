model_id: "Stanford-ILIAD/minivla-libero90-prismatic"
repository: "https://huggingface.co/Stanford-ILIAD/minivla-libero90-prismatic"
revision: "4289f87e8e00706e188c7a3a61fc6e7d72ab2564"
commit_url: "https://huggingface.co/Stanford-ILIAD/minivla-libero90-prismatic/commit/4289f87e8e00706e188c7a3a61fc6e7d72ab2564"
checkpoint: "Stanford-ILIAD/minivla-libero90-prismatic"

action_dim: 7
chunk_size: 1
n_action_steps: 1
image_resolution: [224, 224]

action_decoder: "extra_action_tokenizer"
action_bins: 256
action_range: [-1.0, 1.0]

official_inference_contract:
  source_revision: "0822b36227b5a771be4eb2680e34c559734c8fdc"
  source_files:
    - "prismatic/models/load.py"
    - "prismatic/models/vlas/openvla.py"
    - "prismatic/vla/action_tokenizer.py"
    - "experiments/robot/libero/run_libero_eval.py"
  image_path:
    libero_runner: "np.flipud -> PIL RGB -> 224x224 LANCZOS"
    model: "vision_backbone.get_image_transform()"
    primary_camera: "agentview_image"
    wrist_camera_default: false
    observation_history_default: 1
  prompt: "Prismatic prompt builder; lower-cased task instruction; 'What action should the robot take to ...?'"
  state_or_proprioception: "Not consumed by the official Prismatic predict_action call."
  action:
    dimension_from: "dataset_statistics.json:libero_90.action.q01"
    training_dimension: 7
    per_timestep_action_tokens: 7
    output_steps: 1
    unnormalization: "q01/q99 with dataset action mask"
    libero_gripper_postprocess: "[0,1] -> [-1,+1], sign-binarize, then invert for Prismatic"

camera_mapping:
  agentview: "image_primary"
  robot0_eye_in_hand: "image_wrist"

action_semantics:
  - "delta_x"
  - "delta_y"
  - "delta_z"
  - "delta_roll"
  - "delta_pitch"
  - "delta_yaw"
  - "gripper"

normalization:
  method: "quantile_normalization"
  source: "dataset_statistics.json"

hardware_requirements:
  min_ram_gb: 16
  min_vram_gb: 4
  recommended_device: "cuda"

gripper_action_polarity: "INVERTED_RLDS_TO_ROBOSUITE"

