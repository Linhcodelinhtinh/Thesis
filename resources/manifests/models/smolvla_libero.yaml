action_dim: 7
chunk_size: 50
n_action_steps: 50
image_resolution: [256, 256]

camera_mapping:
  agentview: "observation.images.camera1"
  robot0_eye_in_hand: "observation.images.camera2"

state_inputs:
  shape: [6]
  type: "STATE"
  semantics: ["eef_pos_x", "eef_pos_y", "eef_pos_z", "eef_axis_x", "eef_axis_y", "eef_axis_z"]

processor_pipeline:
  preprocessor_steps:
    - step: 0
      name: "RenameObservationsProcessorStep"
      mapping: {"observation.images.image": "observation.images.camera1", "observation.images.image2": "observation.images.camera2"}
    - step: 1
      name: "AddBatchDimensionProcessorStep"
    - step: 2
      name: "NewLineTaskProcessorStep"
    - step: 3
      name: "TokenizerProcessorStep"
    - step: 4
      name: "DeviceProcessorStep"
    - step: 5
      name: "NormalizerProcessorStep"
      source_file: "policy_preprocessor_step_5_normalizer_processor.safetensors"
  postprocessor_steps:
    - step: 0
      name: "UnnormalizerProcessorStep"
      source_file: "policy_postprocessor_step_0_unnormalizer_processor.safetensors"
    - step: 1
      name: "DeviceProcessorStep"

normalization:
  VISUAL: "IDENTITY"
  STATE: "MEAN_STD"
  ACTION: "MEAN_STD"

action_semantics:
  - "dx"
  - "dy"
  - "dz"
  - "droll"
  - "dpitch"
  - "dyaw"
  - "gripper"

action_range: [-1.0, 1.0]
action_decoder: "flow_matching"

hardware_requirements:
  recommended_gpu: "NVIDIA RTX 4060 (8GB VRAM) or higher"
  dtype: "float32 / bfloat16"
  min_ram_gb: 16

metadata_notes: >
  DISCREPANCY AUDIT: config.json declares observation.images.camera3, but official
  policy_preprocessor.json only renames image -> camera1 and image2 -> camera2.
  In actual LIBERO benchmark training, only agentview and eye_in_hand are utilized.
  camera3 is unused and omitted in evaluation observations.
