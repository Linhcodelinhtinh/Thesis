model_id: "Stanford-ILIAD/minivla-vq-libero90-prismatic"
repository: "https://huggingface.co/Stanford-ILIAD/minivla-vq-libero90-prismatic"
revision: "b08980cdc05dcaea09673e0d97e2c3bc6aef2494"
commit_url: "https://huggingface.co/Stanford-ILIAD/minivla-vq-libero90-prismatic/commit/b08980cdc05dcaea09673e0d97e2c3bc6aef2494"
checkpoint: "Stanford-ILIAD/minivla-vq-libero90-prismatic"

action_dim: 7
chunk_size: 10
n_action_steps: 10
image_resolution: [224, 224]

