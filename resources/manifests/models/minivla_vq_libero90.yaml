hardware_requirements:
  min_ram_gb: 16
  min_vram_gb: 4
  recommended_device: "cuda"

gripper_action_polarity: "DIRECT"

metadata_notes: "MiniVLA 0.5B VQ (Qwen2.5-0.5B + SigLIP-224px + Residual-VQ tokenizer) for LIBERO-90 chunk prediction."
