model_id: "Stanford-ILIAD/minivla-vq-libero90-prismatic"
repository: "https://huggingface.co/Stanford-ILIAD/minivla-vq-libero90-prismatic"
revision: "b08980cdc05dcaea09673e0d97e2c3bc6aef2494"
commit_url: "https://huggingface.co/Stanford-ILIAD/minivla-vq-libero90-prismatic/commit/b08980cdc05dcaea09673e0d97e2c3bc6aef2494"
checkpoint: "Stanford-ILIAD/minivla-vq-libero90-prismatic"

action_dim: 7
chunk_size: 10
n_action_steps: 10
image_resolution: [224, 224]

action_decoder: "libero_vq_extra_action_tokenizer"
action_range: [-1.0, 1.0]

camera_mapping:
  agentview: "image_primary"
  robot0_eye_in_hand: "image_wrist"

action_semantics:
  - "delta_x"
  - "delta_y"
  - "delta_z"
  - "delta_roll"
  - "delta_pitch"
  - "delta_yaw"
  - "gripper"

normalization:
  method: "residual_vq_codebook"
  source: "dataset_statistics.json"

hardware_requirements:
  min_ram_gb: 16
  min_vram_gb: 4
  recommended_device: "cuda"

gripper_action_polarity: "INVERTED_RLDS_TO_ROBOSUITE"

evaluation_status: "BLOCKED_OFFICIAL_CONTRACT_AUDIT"
checkpoint_selection:
  status: "UNRESOLVED"
  selection_rule: "Require the exact checkpoint filename and hash from an official evaluation specification."
vq_codebook:
  status: "MISSING_LOCAL_RESOURCE"
  official_resource_revision: null
  checkpoint_sha256: null
  config_sha256: null
  note: "The adapter requires the trained VQ-VAE codebook; a zero-filled or reconstructed codebook is not valid."
official_code_audit:
  repository: "https://github.com/Stanford-ILIAD/openvla-mini"
  revision: "0822b36227b5a771be4eb2680e34c559734c8fdc"
contract_findings:
  status: "BLOCKED"
  required: "Pin exact VQ model/checkpoint, codebook revision and hashes, then verify the official VQ decoder and action chunk execution contract."
  shared_minivla_contract: "Use the official Prismatic image transform, prompt builder, action statistics and LIBERO gripper postprocessing."

metadata_notes: "MiniVLA 0.5B VQ candidate. It is not evaluation-ready: the VQ-VAE codebook is absent locally and its revision/hash, official action chunk decode and shared Prismatic runtime contract have not been validated."
